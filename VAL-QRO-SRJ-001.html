.sub-tabs{display:flex;background:white;border-bottom:2px solid #e0e0e0}

.alerta{display:none;position:fixed;bottom:0;left:0;right:0;z-index:2000;background:white;border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.25);padding:18px 18px 28px}
.alerta.show{display:block}
.al-label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.al-icon{font-size:28px;margin-bottom:4px}
.al-nombre{font-size:19px;font-weight:800;color:#1a3a5c;margin-bottom:2px}
.al-tipo{font-size:12px;color:#888;margin-bottom:2px}

.btn-cerrar{position:absolute;top:14px;right:14px;background:#f0f4f8;border:none;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;color:#555}
#tab-res{padding:12px;display:none}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}

<script>
const ID_RUTA='VAL-QRO-SRJ-001';
const TOTAL_PTS=39;
const PUNTOS=[
  {id:1,lat:20.73770847,lng:-100.39888556,nombre:'Miscelanea Rivera',tipo:'Abarrotes / Miscelanea',icon:'🏪',dia:'L',diaNom:'Lunes',color:'#2e6da4'},

  {id:12,lat:20.73936751,lng:-100.39555885,nombre:'Miscelanea Aracely',tipo:'Abarrotes / Miscelanea',icon:'🏪',dia:'M',diaNom:'Martes',color:'#8e44ad'},
  {id:13,lat:20.73930303,lng:-100.39552216,nombre:'Venta De Ropa Sin Nombre',tipo:'Tienda Independiente',icon:'🏪',dia:'M',diaNom:'Martes',color:'#8e44ad'},
  {id:14,lat:20.73762026,lng:-100.3954674,nombre:'Miscelanea Esther',tipo:'Abarrotes / Miscelanea',icon:'🏪',dia:'M',diaNom:'Martes',color:'#8e44ad'},
  {id:15,lat:20.73923134,lng:-100.39541179,nombre:'Papeleria Sin Nombre',tipo:'Tienda Independiente',icon:'🏪',dia:'M',diaNom:'Martes',color:'#8e44ad'},
  {id:16,lat:20.7390868,lng:-100.39539453,nombre:'Miscelanea La Guadalupana',tipo:'Abarrotes / Miscelanea',icon:'🏪',dia:'M',diaNom:'Martes',color:'#8e44ad'},
  {id:17,lat:20.73879978,lng:-100.39523907,nombre:'Miscelanea Aguilar',tipo:'Abarrotes / Miscelanea',icon:'🏪',dia:'X',diaNom:'Miercoles',color:'#27ae60'},
  {id:18,lat:20.7387549,lng:-100.39523444,nombre:'Venta De Dulces Sin Nombre',tipo:'Tienda Independiente',icon:'🏪',dia:'X',diaNom:'Miercoles',color:'#27ae60'},
  {id:19,lat:20.73760838,lng:-100.39522724,nombre:'Miscelanea Gaby',tipo:'Abarrotes / Miscelanea',icon:'🏪',dia:'X',diaNom:'Miercoles',color:'#27ae60'},
  {id:20,lat:20.73792105,lng:-100.39514208,nombre:'Ferreteria Chavita',tipo:'Tienda Independiente',icon:'🏪',dia:'X',diaNom:'Miercoles',color:'#27ae60'},
  {id:21,lat:20.7390087,lng:-100.39498808,nombre:'Papeleria Sin Nombre',tipo:'Tienda Independiente',icon:'🏪',dia:'X',diaNom:'Miercoles',color:'#27ae60'},
  {id:22,lat:20.73899767,lng:-100.3947574,nombre:'Miscelanea Elena',tipo:'Abarrotes / Miscelanea',icon:'🏪',dia:'X',diaNom:'Miercoles',color:'#27ae60'},
  {id:23,lat:20.73899386,lng:-100.39457395,nombre:'Miscelanea Yesi Y Fer',tipo:'Abarrotes / Miscelanea',icon:'🏪',dia:'X',diaNom:'Miercoles',color:'#27ae60'},
  {id:24,lat:20.73945622,lng:-100.39455928,nombre:'Miscelanea Sanchez',tipo:'Abarrotes / Miscelanea',icon:'🏪',dia:'X',diaNom:'Miercoles',color:'#27ae60'},
  {id:25,lat:20.73957477,lng:-100.39454396,nombre:'Venta De Dulces Y Frituras Sin Nombre',tipo:'Tienda Independiente',icon:'🏪',dia:'J',diaNom:'Jueves',color:'#e67e22'},
  {id:26,lat:20.73889289,lng:-100.39452703,nombre:'Carniceria Bustista',tipo:'Carniceria',icon:'🥩',dia:'J',diaNom:'Jueves',color:'#e67e22'},
  {id:27,lat:20.73897757,lng:-100.39450582,nombre:'Miscelanea Alfredo',tipo:'Abarrotes / Miscelanea',icon:'🏪',dia:'J',diaNom:'Jueves',color:'#e67e22'},
  {id:28,lat:20.73896786,lng:-100.39446743,nombre:'Ferreteria Morales',tipo:'Tienda Independiente',icon:'🏪',dia:'J',diaNom:'Jueves',color:'#e67e22'},
  {id:29,lat:20.73950322,lng:-100.39430793,nombre:'Frituras Sin Nombre',tipo:'Tienda Independiente',icon:'🏪',dia:'J',diaNom:'Jueves',color:'#e67e22'},
  {id:30,lat:20.73949928,lng:-100.39393185,nombre:'Frutas Y Verduras Sin Nombre',tipo:'Fruteria',icon:'🥦',dia:'J',diaNom:'Jueves',color:'#e67e22'},
  {id:31,lat:20.73944654,lng:-100.39388318,nombre:'Miscelanea Daria',tipo:'Abarrotes / Miscelanea',icon:'🏪',dia:'J',diaNom:'Jueves',color:'#e67e22'},
  {id:32,lat:20.7387816,lng:-100.39340028,nombre:'Tienda De Dulces Sin Nombre',tipo:'Tienda Independiente',icon:'🏪',dia:'J',diaNom:'Jueves',color:'#e67e22'},
  {id:33,lat:20.73810705,lng:-100.39329714,nombre:'Miscelanea Jose Agustin',tipo:'Abarrotes / Miscelanea',icon:'🏪',dia:'V',diaNom:'Viernes',color:'#c0392b'},
  {id:34,lat:20.73864141,lng:-100.39322936,nombre:'Productos De Limpieza Sin Nombre',tipo:'Tienda Independiente',icon:'🏪',dia:'V',diaNom:'Viernes',color:'#c0392b'},
  {id:35,lat:20.73864445,lng:-100.39276506,nombre:'Papeleria Mar',tipo:'Tienda Independiente',icon:'🏪',dia:'V',diaNom:'Viernes',color:'#c0392b'},
  {id:36,lat:20.73822476,lng:-100.39232804,nombre:'Miscelanea Alvarez',tipo:'Abarrotes / Miscelanea',icon:'🏪',dia:'V',diaNom:'Viernes',color:'#c0392b'},
  {id:37,lat:20.73857069,lng:-100.39113668,nombre:'Miscelanea Vivi',tipo:'Abarrotes / Miscelanea',icon:'🏪',dia:'V',diaNom:'Viernes',color:'#c0392b'},
  {id:38,lat:20.73843549,lng:-100.39072874,nombre:'Dany Diconsa',tipo:'Abarrotes / Miscelanea',icon:'🏪',dia:'V',diaNom:'Viernes',color:'#c0392b'},
  {id:39,lat:20.73853741,lng:-100.39012457,nombre:'Dulceria Sin Nombre',tipo:'Tienda Independiente',icon:'🏪',dia:'V',diaNom:'Viernes',color:'#c0392b'}
];
const DIAS_INFO={L:{nom:'Lunes',color:'#2e6da4'},M:{nom:'Martes',color:'#8e44ad'},X:{nom:'Miercoles',color:'#27ae60'},J:{nom:'Jueves',color:'#e67e22'},V:{nom:'Viernes',color:'#c0392b'}};
const RADIO=100;
let estado=JSON.parse(localStorage.getItem('val_'+ID_RUTA)||'{}');
let diaActivo='L',puntoActivo=null,miUbicacion=null,markerYo=null,marcadores={},alertaMostrada=false;

const map=L.map('map').setView([20.716,-100.389],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);

function iconM(p){
  const e=estado[p.id],bg=e?(e.existe?'#27ae60':'#e74c3c'):p.color;
  return L.divIcon({className:'',html:`<div style="background:${bg};width:22px;height:22px;border-radius:50%;border:2px solid white;display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 2px 5px rgba(0,0,0,.3)">${p.icon}</div>`,iconSize:[22,22],iconAnchor:[11,11]});
}

PUNTOS.forEach(p=>{
  const m=L.marker([p.lat,p.lng],{icon:iconM(p)}).addTo(map)
    .bindPopup(`<b>${p.icon} ${p.nombre}</b><br>${p.tipo}<br><small>${ID_RUTA}-${p.dia}-${p.id}</small>`)
    .on('click',()=>abrirAlerta(p.id));
  marcadores[p.id]=m;
});

// Circulo de referencia 3 km
L.circle([20.716,-100.389],{radius:3000,color:'#2e6da4',weight:1,fillOpacity:.03,dashArray:'6,6'}).addTo(map);

if('geolocation' in navigator){
  navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:5000,timeout:10000});
}else{document.getElementById('gpsMsg').textContent='GPS no disponible';document.getElementById('gpsDot').classList.add('err');}

function onPos(pos){
  const lat=pos.coords.latitude,lng=pos.coords.longitude,acc=Math.round(pos.coords.accuracy);
  miUbicacion={lat,lng};
  document.getElementById('gpsDot').classList.remove('err');document.getElementById('gpsDot').classList.add('on');
  document.getElementById('gpsMsg').textContent=`GPS activo — precision +-${acc}m`;
  if(!markerYo)markerYo=L.circleMarker([lat,lng],{radius:10,color:'#e67e22',fillColor:'#f39c12',fillOpacity:.9,weight:3}).addTo(map).bindPopup('📍 Tu estas aqui');
  else markerYo.setLatLng([lat,lng]);
  verificarCercania(lat,lng);
}
function onErr(err){document.getElementById('gpsDot').classList.add('err');document.getElementById('gpsMsg').textContent='Error GPS: '+(err.code===1?'Permiso denegado':err.code===2?'Sin senal':'Timeout');}

function dist(a,b,c,d){const R=6371000,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

function verificarCercania(lat,lng){
  const hoy=PUNTOS.filter(p=>p.dia===diaActivo);
  let mejor=null,minD=Infinity;
  hoy.forEach(p=>{const d=dist(lat,lng,p.lat,p.lng);if(d<minD){minD=d;mejor=p;}marcadores[p.id].setIcon(iconM(p));});
  renderLista();
  if(mejor&&minD<RADIO&&!estado[mejor.id]&&!alertaMostrada){alertaMostrada=true;abrirAlerta(mejor.id);}
  if(minD>=RADIO)alertaMostrada=false;
}

function abrirAlerta(id){
  const p=PUNTOS.find(x=>x.id===id);puntoActivo=id;
  document.getElementById('al-icon').textContent=p.icon;
  document.getElementById('al-nombre').textContent=p.nombre;
  document.getElementById('al-tipo').textContent=p.tipo;
  document.getElementById('al-coords').textContent=`${p.lat.toFixed(6)}, ${p.lng.toFixed(6)} · ${ID_RUTA}-${p.dia}-${p.id}`;
  document.getElementById('alerta').classList.add('show');
  map.setView([p.lat,p.lng],16);
}
function cerrarAlerta(){document.getElementById('alerta').classList.remove('show');puntoActivo=null;}

function validar(existe){
  if(puntoActivo===null)return;
  estado[puntoActivo]={existe,ts:new Date().toISOString()};
  localStorage.setItem('val_'+ID_RUTA,JSON.stringify(estado));
  marcadores[puntoActivo].setIcon(iconM(PUNTOS.find(p=>p.id===puntoActivo)));
  cerrarAlerta();renderLista();actualizarResultados();actualizarProgreso();actualizarTabDias();
}

function renderLista(){
  const hoy=PUNTOS.filter(p=>p.dia===diaActivo);
  document.getElementById('tab-lista').innerHTML=hoy.map(p=>{
    const e=estado[p.id],cls=e?(e.existe?'existe':'no-existe'):'';
    const badge=e?(e.existe?'<span class="p-badge b-ok">✅ Existe</span>':'<span class="p-badge b-no">❌ No existe</span>'):'<span class="p-badge b-pen">⏳</span>';
    const dm=miUbicacion?` · ${Math.round(dist(miUbicacion.lat,miUbicacion.lng,p.lat,p.lng))}m`:'';
    return `<div class="punto-card ${cls}" onclick="abrirAlerta(${p.id})"><div class="p-icon">${p.icon}</div><div class="p-info"><div class="p-nombre">${p.nombre}</div><div class="p-tipo">${p.tipo}</div><div class="p-dist">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}${dm}</div></div>${badge}</div>`;
  }).join('');
}

function actualizarResultados(){
  const vals=Object.values(estado),ok=vals.filter(v=>v.existe).length,no=vals.filter(v=>!v.existe).length,pen=TOTAL_PTS-vals.length;
  document.getElementById('r-ok').textContent=ok;document.getElementById('r-no').textContent=no;document.getElementById('r-pen').textContent=pen;
  const pok=Math.round(ok/TOTAL_PTS*100),pno=Math.round(no/TOTAL_PTS*100);
  document.getElementById('g-ok').style.width=pok+'%';document.getElementById('g-ok').textContent=pok?pok+'%':'';
  document.getElementById('g-no').style.width=pno+'%';document.getElementById('g-no').textContent=pno?pno+'%':'';
  document.getElementById('diasAvance').innerHTML=Object.entries(DIAS_INFO).map(([key,info])=>{
    const pts=PUNTOS.filter(p=>p.dia===key);if(!pts.length)return '';
    const v=pts.filter(p=>estado[p.id]).length,pct=Math.round(v/pts.length*100);
    return `<div class="dia-row"><div class="dia-dot" style="background:${info.color}"></div><span class="dia-nm">${info.nom}</span><div class="dia-br-bg"><div class="dia-br-fill" style="background:${info.color};width:${pct}%">${pct?pct+'%':''}</div></div><span class="dia-num">${v}/${pts.length}</span></div>`;
  }).join('');
}
function actualizarProgreso(){
  const h=Object.keys(estado).length,pct=Math.round(h/TOTAL_PTS*100);
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progTxt').textContent=`${h} / ${TOTAL_PTS} validados (${pct}%)`;
}
function actualizarTabDias(){
  ['L','M','X','J','V'].forEach(key=>{
    const pts=PUNTOS.filter(p=>p.dia===key),el=document.getElementById('cnt-'+key);
    if(!el||!pts.length)return;
    const v=pts.filter(p=>estado[p.id]).length;
    el.textContent=`${v}/${pts.length}`;el.className=v===pts.length?'cnt done':'cnt';
  });
}
function setDia(dia){
  diaActivo=dia;
  document.querySelectorAll('.dia-tab').forEach(t=>t.classList.remove('act'));
  document.getElementById('tab-'+dia).classList.add('act');
  const pts=PUNTOS.filter(p=>p.dia===dia);
  if(pts.length){const lats=pts.map(p=>p.lat),lons=pts.map(p=>p.lng);map.fitBounds([[Math.min(...lats),Math.min(...lons)],[Math.max(...lats),Math.max(...lons)]],{padding:[30,30]});}
  renderLista();
}
function setSubTab(tab){
  document.querySelectorAll('.sub-tab').forEach((t,i)=>t.classList.toggle('act',['lista','res'][i]===tab));
  document.getElementById('tab-lista').style.display=tab==='lista'?'':'none';
  document.getElementById('tab-res').style.display=tab==='res'?'block':'none';
  if(tab==='res')actualizarResultados();
}
function exportar(){
  const vals=Object.values(estado),ok=vals.filter(v=>v.existe).length,no=vals.filter(v=>!v.existe).length;
  let txt=`REPORTE DE VALIDACION\nID Ruta   : ${ID_RUTA}\nID Coord  : VAL-QRO-SRJ-20716_100389\nZona      : Santa Rosa de Jauregui, QRO — Tiendas Independientes — 3 km\nCentro    : 20.716, -100.389\nFecha     : ${new Date().toLocaleDateString('es-MX')}\nFuente    : DENUE INEGI (estrato 0-5)\n\nRESUMEN\nTotal     : ${TOTAL_PTS}\n✅ Existen  : ${ok} (${Math.round(ok/TOTAL_PTS*100)}%)\n❌ No exist : ${no} (${Math.round(no/TOTAL_PTS*100)}%)\n⏳ Pendient : ${TOTAL_PTS-vals.length}\n\n`;
  ['L','M','X','J','V'].forEach(key=>{
    const info=DIAS_INFO[key],pts=PUNTOS.filter(p=>p.dia===key);
    if(!pts.length)return;
    const v=pts.filter(p=>estado[p.id]).length;
    txt+=`${info.nom}: ${v}/${pts.length} validados\n`;
    pts.forEach(p=>{const e=estado[p.id];txt+=`  [${ID_RUTA}-${p.dia}-${p.id}] ${p.nombre} (${p.tipo}): ${e?(e.existe?'EXISTE':'NO EXISTE'):'PENDIENTE'}${e?' — '+new Date(e.ts).toLocaleString('es-MX'):''}\n`;});
    txt+='\n';
  });
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download=`${ID_RUTA}_${new Date().toISOString().slice(0,10)}.txt`;a.click();
}
function resetear(){if(!confirm('¿Reiniciar toda la validacion?'))return;localStorage.removeItem('val_'+ID_RUTA);estado={};PUNTOS.forEach(p=>marcadores[p.id].setIcon(iconM(p)));renderLista();actualizarResultados();actualizarProgreso();actualizarTabDias();}

renderLista();actualizarResultados();actualizarProgreso();actualizarTabDias();setDia('L');
</script>
</body>
</html>
