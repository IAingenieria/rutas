function iconM(p){
  const e=estado[p.id],bg=e?(e.existe?'#27ae60':'#e74c3c'):p.color;
  return L.divIcon({className:'',html:`<div style="background:${bg};width:22px;height:22px;border-radius:50%;border:2px solid white;display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 2px 5px rgba(0,0,0,.3)">${p.icon}</div>`,iconSize:[22,22],iconAnchor:[11,11]});
}

PUNTOS.forEach(p=>{
  const m=L.marker([p.lat,p.lng],{icon:iconM(p)}).addTo(map)
    .bindPopup(`<b>${p.icon} ${p.nombre}</b><br>${p.tipo}<br><small>${ID_RUTA}-${p.dia}-${p.id}</small>`)
    .on('click',()=>abrirAlerta(p.id));
  marcadores[p.id]=m;
});

if('geolocation' in navigator){
  navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:5000,timeout:10000});
}else{document.getElementById('gpsMsg').textContent='GPS no disponible';document.getElementById('gpsDot').classList.add('err');}

function onPos(pos){
  const lat=pos.coords.latitude,lng=pos.coords.longitude,acc=Math.round(pos.coords.accuracy);
  miUbicacion={lat,lng};
  document.getElementById('gpsDot').classList.remove('err');document.getElementById('gpsDot').classList.add('on');
  document.getElementById('gpsMsg').textContent=`GPS activo — precision +-${acc}m`;
  if(!markerYo)markerYo=L.circleMarker([lat,lng],{radius:10,color:'#e67e22',fillColor:'#f39c12',fillOpacity:.9,weight:3}).addTo(map).bindPopup('📍 Tu estas aqui');
  else markerYo.setLatLng([lat,lng]);
  verificarCercania(lat,lng);
}
function onErr(err){document.getElementById('gpsDot').classList.add('err');document.getElementById('gpsMsg').textContent='Error GPS: '+(err.code===1?'Permiso denegado':err.code===2?'Sin senal':'Timeout');}

function dist(a,b,c,d){const R=6371000,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

function verificarCercania(lat,lng){
  const hoy=PUNTOS.filter(p=>p.dia===diaActivo);
  let mejor=null,minD=Infinity;
  hoy.forEach(p=>{const d=dist(lat,lng,p.lat,p.lng);if(d<minD){minD=d;mejor=p;}marcadores[p.id].setIcon(iconM(p));});
  renderLista();
  if(mejor&&minD<RADIO&&!estado[mejor.id]&&!alertaMostrada){alertaMostrada=true;abrirAlerta(mejor.id);}
  if(minD>=RADIO)alertaMostrada=false;
}

function abrirAlerta(id){
  const p=PUNTOS.find(x=>x.id===id);puntoActivo=id;
  document.getElementById('al-icon').textContent=p.icon;
  document.getElementById('al-nombre').textContent=p.nombre;
  document.getElementById('al-tipo').textContent=p.tipo;
  document.getElementById('al-coords').textContent=`${p.lat.toFixed(6)}, ${p.lng.toFixed(6)} · ${ID_RUTA}-${p.dia}-${p.id}`;
  document.getElementById('alerta').classList.add('show');
  map.setView([p.lat,p.lng],16);
}
function cerrarAlerta(){document.getElementById('alerta').classList.remove('show');puntoActivo=null;}

function validar(existe){
  if(puntoActivo===null)return;
  estado[puntoActivo]={existe,ts:new Date().toISOString()};
  localStorage.setItem('val_'+ID_RUTA,JSON.stringify(estado));
  marcadores[puntoActivo].setIcon(iconM(PUNTOS.find(p=>p.id===puntoActivo)));
  cerrarAlerta();renderLista();actualizarResultados();actualizarProgreso();actualizarTabDias();
}

function renderLista(){
  const hoy=PUNTOS.filter(p=>p.dia===diaActivo);
  document.getElementById('tab-lista').innerHTML=hoy.map(p=>{
    const e=estado[p.id],cls=e?(e.existe?'existe':'no-existe'):'';
    const badge=e?(e.existe?'<span class="p-badge b-ok">✅ Existe</span>':'<span class="p-badge b-no">❌ No existe</span>'):'<span class="p-badge b-pen">⏳</span>';
    const dm=miUbicacion?` · ${Math.round(dist(miUbicacion.lat,miUbicacion.lng,p.lat,p.lng))}m`:'';
    return `<div class="punto-card ${cls}" onclick="abrirAlerta(${p.id})"><div class="p-icon">${p.icon}</div><div class="p-info"><div class="p-nombre">${p.nombre}</div><div class="p-tipo">${p.tipo}</div><div class="p-dist">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}${dm}</div></div>${badge}</div>`;
  }).join('');
}

function actualizarResultados(){
  const vals=Object.values(estado),ok=vals.filter(v=>v.existe).length,no=vals.filter(v=>!v.existe).length,pen=TOTAL_PTS-vals.length;
  document.getElementById('r-ok').textContent=ok;document.getElementById('r-no').textContent=no;document.getElementById('r-pen').textContent=pen;
  const pok=Math.round(ok/TOTAL_PTS*100),pno=Math.round(no/TOTAL_PTS*100);
  document.getElementById('g-ok').style.width=pok+'%';document.getElementById('g-ok').textContent=pok?pok+'%':'';
  document.getElementById('g-no').style.width=pno+'%';document.getElementById('g-no').textContent=pno?pno+'%':'';
  document.getElementById('diasAvance').innerHTML=DIAS_KEYS.map(key=>{
    const info=DIAS_INFO[key],pts=PUNTOS.filter(p=>p.dia===key);if(!pts.length)return '';
    const v=pts.filter(p=>estado[p.id]).length,pct=Math.round(v/pts.length*100);
    return `<div class="dia-row"><div class="dia-dot" style="background:${info.color}"></div><span class="dia-nm">${info.nom}</span><div class="dia-br-bg"><div class="dia-br-fill" style="background:${info.color};width:${pct}%">${pct?pct+'%':''}</div></div><span class="dia-num">${v}/${pts.length}</span></div>`;
  }).join('');
}
function actualizarProgreso(){
  const h=Object.keys(estado).length,pct=Math.round(h/TOTAL_PTS*100);
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progTxt').textContent=`${h} / ${TOTAL_PTS} validados (${pct}%)`;
}
function actualizarTabDias(){
  DIAS_KEYS.forEach(key=>{
    const pts=PUNTOS.filter(p=>p.dia===key),el=document.getElementById('cnt-'+key);
    if(!el||!pts.length)return;
    const v=pts.filter(p=>estado[p.id]).length;
    el.textContent=`${v}/${pts.length}`;el.className=v===pts.length?'cnt done':'cnt';
  });
}
function setDia(dia){
  diaActivo=dia;
  document.querySelectorAll('.dia-tab').forEach(t=>t.classList.remove('act'));
  document.getElementById('tab-'+dia).classList.add('act');
  const pts=PUNTOS.filter(p=>p.dia===dia);
  if(pts.length){const lats=pts.map(p=>p.lat),lons=pts.map(p=>p.lng);map.fitBounds([[Math.min(...lats),Math.min(...lons)],[Math.max(...lats),Math.max(...lons)]],{padding:[30,30]});}
  renderLista();
}
function setSubTab(tab){
  document.querySelectorAll('.sub-tab').forEach((t,i)=>t.classList.toggle('act',['lista','res'][i]===tab));
  document.getElementById('tab-lista').style.display=tab==='lista'?'':'none';
  document.getElementById('tab-res').style.display=tab==='res'?'block':'none';
  if(tab==='res')actualizarResultados();
}
function exportar(){
  const vals=Object.values(estado),ok=vals.filter(v=>v.existe).length,no=vals.filter(v=>!v.existe).length;
  let txt=`REPORTE DE VALIDACION\nID Ruta   : ${ID_RUTA}\nRuta      : Carr. Fed. 51 Apaseo el Grande → San Miguel de Allende, GTO\nCorredor  : ±500m de la carretera\nFecha     : ${new Date().toLocaleDateString('es-MX')}\nFuente    : DENUE INEGI (SCIAN 461xxx, estrato 0-5)\n\nRESUMEN\nTotal     : ${TOTAL_PTS}\n✅ Existen  : ${ok} (${Math.round(ok/TOTAL_PTS*100)}%)\n❌ No exist : ${no} (${Math.round(no/TOTAL_PTS*100)}%)\n⏳ Pendient : ${TOTAL_PTS-vals.length}\n\n`;
  DIAS_KEYS.forEach(key=>{
    const info=DIAS_INFO[key],pts=PUNTOS.filter(p=>p.dia===key);
    if(!pts.length)return;
    const v=pts.filter(p=>estado[p.id]).length;
    txt+=`${info.nom}: ${v}/${pts.length} validados\n`;
    pts.forEach(p=>{const e=estado[p.id];txt+=`  [${ID_RUTA}-${p.dia}-${p.id}] ${p.nombre} (${p.tipo}): ${e?(e.existe?'EXISTE':'NO EXISTE'):'PENDIENTE'}${e?' — '+new Date(e.ts).toLocaleString('es-MX'):''}\n`;});
    txt+='\n';
  });
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download=`${ID_RUTA}_${new Date().toISOString().slice(0,10)}.txt`;a.click();
}
function resetear(){if(!confirm('¿Reiniciar toda la validacion?'))return;localStorage.removeItem('val_'+ID_RUTA);estado={};PUNTOS.forEach(p=>marcadores[p.id].setIcon(iconM(p)));renderLista();actualizarResultados();actualizarProgreso();actualizarTabDias();}

renderLista();actualizarResultados();actualizarProgreso();actualizarTabDias();setDia('L');
</script>
